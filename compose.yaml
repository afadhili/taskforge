services:
  api:
    build:
      context: ./backend
    container_name: taskforge-api
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: taskforge
      DB_USERNAME: taskforge
      DB_PASSWORD: taskforge-local
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
    container_name: taskforge-frontend
    restart: unless-stopped
    environment:
      VITE_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5174:5174"
    depends_on:
      - api
  postgres:
    image: postgres:17-alpine
    container_name: taskforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskforge
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge-local
    ports:
      - "5433:5432"
    volumes:
      - taskforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge -d taskforge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  taskforge-postgres:
  frontend-node-modules:
